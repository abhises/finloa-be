# Production stack. Copied to /opt/finloa/docker-compose.yml on the server by the
# finloa-be deploy workflow. Secrets come from /opt/finloa/.env (never committed).
name: finloa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  backend:
    image: ghcr.io/abhises/finloa-be:${BACKEND_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  frontend:
    image: ghcr.io/abhises/finloa-fe:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    environment:
      # Server-side fetches (plans, posts) go straight to the backend container
      API_INTERNAL_URL: http://backend:4000
    mem_limit: 320m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
