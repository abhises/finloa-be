name: CI / Deploy backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/abhises/finloa-be
  APP_DIR: /opt/finloa

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Strip stray spaces/newlines that sneak in when pasting secrets
          HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          USER_NAME="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          {
            echo "Host deploy"
            echo "  HostName $HOST"
            echo "  User $USER_NAME"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  ConnectTimeout 20"
          } > ~/.ssh/config
          ssh deploy true && echo "SSH connection OK"

      - name: Copy stack files to server
        run: |
          scp deploy/docker-compose.prod.yml "deploy:$APP_DIR/docker-compose.yml"
          scp deploy/Caddyfile "deploy:$APP_DIR/Caddyfile"

      - name: Deploy on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh deploy \
            "APP_DIR='$APP_DIR' ACTOR='${{ github.actor }}' TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker compose pull backend
          docker compose up -d db backend caddy
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
          docker logout ghcr.io
          docker image prune -f
          for i in $(seq 1 30); do
            if docker compose exec -T backend wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
              echo "Backend healthy"; exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy"; docker compose logs --tail=80 backend; exit 1
          REMOTE
